# Render Blueprint: statyczna strona gry (docs/DEPLOY.md, ADR 0006).
# Nagłówki muszą być identyczne z public/_headers; pilnuje tego test
# scripts/lib/render-config.test.ts.
services:
  - type: web
    runtime: static
    name: five-fangs
    branch: main
    # Deploy dopiero po przejściu checków CI na commicie.
    autoDeployTrigger: checksPass
    # pnpm przez `corepack pnpm`, nie `corepack enable`: na Render Node i jego skróty leżą
    # w /usr, który jest tylko do odczytu, więc `corepack enable` kończy się błędem EROFS.
    # Wersję pnpm wyznacza pole packageManager, tak samo jak w CI.
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm build
    staticPublishPath: ./dist
    buildFilter:
      ignoredPaths:
        - docs/**
        - reports/**
        - tests/**
        - "**/*.md"
        - "**/*.test.ts"
    envVars:
      # Domyślnie Render sam instaluje zależności strony statycznej, zanim uruchomi
      # buildCommand, swoją wersją pnpm, która może nie pasować do lockfile'a pnpm 12.
      # Instalację robi buildCommand: pnpm z pola packageManager przez Corepack.
      - key: SKIP_INSTALL_DEPS
        value: "true"
      # Corepack nie pyta o zgodę na pobranie pnpm: build nie ma terminala.
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: "0"
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /version.json
        name: Cache-Control
        value: no-cache
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=()
